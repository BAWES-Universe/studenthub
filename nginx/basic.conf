server {
    listen 80;
    server_name localhost 127.0.0.1 192.168.1.2;

    root /var/www/html;  # Path to your website’s root directory in the container
    index index.php index.html index.htm;

    # Handle static files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass app:9000;  # Connect to the PHP-FPM container via the service name and port
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Optional: Block access to hidden files like .htaccess
    location ~ /\.ht {
        deny all;
    }
}
