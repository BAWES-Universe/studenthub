server {
    listen 80;
    server_name employer.api.dev.studenthub.co;

    location / {
        proxy_pass http://127.0.0.1:80/company/web; # Replace 80 with your Docker container's exposed port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle pretty URLs for Yii framework
        try_files $uri $uri/ /index.php;
    }

    access_log /var/log/nginx/employer_access.log;
    error_log /var/log/nginx/employer_error.log;
}

server {
    listen 443 ssl;
    server_name employer.api.dev.studenthub.co;

    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    location / {
        proxy_pass http://127.0.0.1:80/company/web; # Replace 80 with your Docker container's exposed port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle pretty URLs for Yii framework
        try_files $uri $uri/ /index.php;
    }

    access_log /var/log/nginx/employer_access.log;
    error_log /var/log/nginx/employer_error.log;
}

