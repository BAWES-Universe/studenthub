version: '3.8'

networks:
  studenthub-network:
    driver: bridge

services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_USER=studenthubuser
      - PMA_PASSWORD=studenthub
    ports:
      - "8081:80"
    networks:
      - studenthub-network
    # Note: When chained with dev/prod, mysql service already exists
    # If using standalone, uncomment mysql service below
    # depends_on:
    #   - mysql

