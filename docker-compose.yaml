networks:
  studenthub-network:
    driver: bridge

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=studenthub-network"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"  # Traefik dashboard (direct access, also available via traefik.studenthub.local)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
    networks:
      - studenthub-network
    restart: unless-stopped
    labels:
      # Enable Traefik for itself (dashboard)
      - "traefik.enable=true"
      
      # Traefik dashboard routing
      - "traefik.http.routers.traefik.rule=Host(`traefik.studenthub.local`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  mysql:
    image: mysql:9
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-studenthub}
      - MYSQL_DATABASE=${DB_NAME:-studenthub}
      - MYSQL_USER=${DB_USER:-studenthubuser}
      - MYSQL_PASSWORD=${DB_PASSWORD:-studenthub}
      - MYSQL_SQL_MODE=${MYSQL_SQL_MODE:-STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    networks:
      - studenthub-network

  app:
    build: 
      context: .
      dockerfile: ./Dockerfile-nginx-dev
    container_name: studenthub-backend-dev
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_NAME=${DB_NAME:-studenthub}
      - DB_USER=${DB_USER:-studenthubuser}
      - DB_PASSWORD=${DB_PASSWORD:-studenthub}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
    # Keep port mappings for direct access if needed, but Traefik will handle routing
    ports:
      - "${ADMIN_PORT:-21080}:21080"
      - "${CANDIDATE_PORT:-22080}:22080"
      - "${COMPANY_PORT:-23080}:23080"
      - "${INSPECTOR_PORT:-24080}:24080"
      - "${STAFF_PORT:-25080}:25080"
      - "${VERIFICATION_PORT:-26080}:26080"
      - "${YEASTER_PORT:-3001}:3001"
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
      - mysql
      - traefik
    networks:
      - studenthub-network
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"
      
      # Admin app routing (nginx routes by server_name on port 80)
      - "traefik.http.routers.admin.rule=Host(`admin.studenthub.local`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.service=admin-service"
      - "traefik.http.services.admin-service.loadbalancer.server.port=80"
      
      # Candidate app routing
      - "traefik.http.routers.candidate.rule=Host(`candidate.studenthub.local`)"
      - "traefik.http.routers.candidate.entrypoints=web"
      - "traefik.http.routers.candidate.service=candidate-service"
      - "traefik.http.services.candidate-service.loadbalancer.server.port=80"
      
      # Company app routing
      - "traefik.http.routers.company.rule=Host(`company.studenthub.local`)"
      - "traefik.http.routers.company.entrypoints=web"
      - "traefik.http.routers.company.service=company-service"
      - "traefik.http.services.company-service.loadbalancer.server.port=80"
      
      # Inspector app routing
      - "traefik.http.routers.inspector.rule=Host(`inspector.studenthub.local`)"
      - "traefik.http.routers.inspector.entrypoints=web"
      - "traefik.http.routers.inspector.service=inspector-service"
      - "traefik.http.services.inspector-service.loadbalancer.server.port=80"
      
      # Staff app routing
      - "traefik.http.routers.staff.rule=Host(`staff.studenthub.local`)"
      - "traefik.http.routers.staff.entrypoints=web"
      - "traefik.http.routers.staff.service=staff-service"
      - "traefik.http.services.staff-service.loadbalancer.server.port=80"
      
      # Verification app routing
      - "traefik.http.routers.verification.rule=Host(`verification.studenthub.local`)"
      - "traefik.http.routers.verification.entrypoints=web"
      - "traefik.http.routers.verification.service=verification-service"
      - "traefik.http.services.verification-service.loadbalancer.server.port=80"

  redis:
    image: redis:6.2.3
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - studenthub-network
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  mysql-data:

