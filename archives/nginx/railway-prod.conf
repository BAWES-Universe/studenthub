server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return      404;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.api.studenthub.co;

    include php.conf;

    root /var/www/html/admin/web;
}

