namespace: common\tests
actor: Tester
paths:
    tests: tests
    log: tests/_output
    data: tests/_data
    helpers: tests/_support
    output: tests/_output
bootstrap: _bootstrap.php
settings:
    colors: true
    memory_limit: 1024M
modules:
    enabled:
        - Asserts
        - Yii2
    config:
        Yii2:
            configFile: '/var/www/html/common/config/unit-test-local.php'
