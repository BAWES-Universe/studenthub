namespace: common\tests
actor: Tester
paths:
    tests: tests
    log: tests/_output
    data: tests/_data
    helpers: tests/_support
bootstrap: _bootstrap.php
settings:
    colors: true
    memory_limit: 1024M
modules:
    enabled:
        - Asserts
        - Yii2
        - rest
        - filesystem
    config:
        Yii2:
            configFile: 'config/unit-test-local.php'
