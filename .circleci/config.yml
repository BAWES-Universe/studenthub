# PHP CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-php/ for more details
#
version: 2
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: circleci/php:latest

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      - image: circleci/mysql:latest
        environment:
            MYSQL_DATABASE: payroll
            MYSQL_HOST: 127.0.0.1
            MYSQL_USER: payrollUser
            MYSQL_PASSWORD: pay
            MYSQL_ROOT_HOST: "%"
            MYSQL_ROOT_PASSWORD: pay

    working_directory: ~/payroll

    steps:
      - checkout

      # Install additional PHP modules
      - run: sudo apt-get update
      - run: sudo apt-get install libpng-dev libmcrypt-dev libreadline-dev
      - run: sudo docker-php-ext-install gd
      - run: sudo docker-php-ext-install mcrypt && sudo docker-php-ext-enable mcrypt
      - run: sudo docker-php-ext-install pdo_mysql && sudo docker-php-ext-enable pdo_mysql
      - run: sudo apt-get install mysql-client


      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "composer.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run:
          name: Install Dependencies
          command: composer install -n --prefer-dist

      - save_cache:
          paths:
            - ./vendor
          key: v1-dependencies-{{ checksum "composer.json" }}

      # run tests!
      # - run: phpunit
