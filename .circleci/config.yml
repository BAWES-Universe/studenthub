# PHP CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-php/ for more details
#
version: 2
jobs:
  build:
    branches:
      only:
        - master
        - develop
    docker:
      # specify the version you desire here
      - image: cimg/php:7.4.30-browsers

    #older: 7.3-apache-stretch-node-browsers

      - image: circleci/mysql:5.7
        environment:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: payroll_test
          MYSQL_USER: bawes
          MYSQL_PASSWORD: passw0rd
        command:
            mysqld --sql-mode=NO_ENGINE_SUBSTITUTION --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --innodb-large-prefix=true

    # Specify Server Type. Keep it as small as possible to reduce costs
    resource_class: small

    working_directory: ~/studenthub

    steps:
      - checkout

      - run:
          name: Install things we need
          command: |
            sudo apt-get update
            sudo apt-get install -y libpng-dev libmcrypt-dev libreadline-dev zip zlib1g-dev default-mysql-client ffmpeg

      - run:
          name: Install PHP exts
          command: |
            sudo apt-get install
        #sudo docker-php-ext-install zip
        #sudo docker-php-ext-install pdo_mysql exif && sudo docker-php-ext-enable pdo_mysql
        #sudo docker-php-ext-install libonig-dev mbstring exif
        # sudo docker-php-ext-configure intl
        # sudo docker-php-ext-install intl
        #sudo docker-php-ext-install gd
      
      #- run:
      #    name: Install puppeteer
      #    command: |
      #      curl -sL https://deb.nodesource.com/setup_12.x | sudo -E bash -
      #      sudo apt-get -f install -y nodejs gcc g++ make gconf-service libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libnss3 lsb-release xdg-utils wget libgbm-dev
      #      sudo npm install --global --unsafe-perm puppeteer
      #      sudo chmod -R o+rx /usr/local/lib/node_modules/puppeteer/.local-chromium

      - run:
          name: Install Headless Chrome dependencies
          command: |
            sudo apt-get install -yq gconf-service libasound2 libatk1.0-0 libatk-bridge2.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils wget
      - run:
          name: Install puppeteer with chronium
          command: |
            sudo npm install --global --unsafe-perm puppeteer
            sudo chmod -R o+rx /usr/local/lib/node_modules/puppeteer/.local-chromium

      #libappindicator1 build failed as package was not found

      #sudo apt-get install nodejs
      #sudo apt-get install npm
      #sudo npm i puppeteer -g

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "composer.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run:
          name: Install Dependencies
          command: composer install -n --prefer-dist

      - save_cache:
          paths:
            - ./vendor
          key: v1-dependencies-{{ checksum "composer.json" }}

      - run:
          name: Initialize Dev Environment
          command: ./init --env=Circle-CI --overwrite=All

      - run:
          name: Install DB Migrations
          command: ./yii_test migrate --interactive=0


      #---------- staff app --------------#

      - run:
          name: Run Staff app Codeception functional tests and store result output
          command: cd ./staff && ../vendor/bin/codecept run functional --xml --html --fail-fast

      - run:
         name: Run Staff app Codeception tests and store result output
         command: ./vendor/bin/codecept run staff/tests/unit --xml --html --fail-fast

      #---------- company app --------------#

      - run:
          name: Run Company app Codeception functional tests and store result output
          command: cd ./company && ../vendor/bin/codecept run functional --xml --html --fail-fast

      - run:
         name: Run Company app Codeception tests and store result output
         command: ./vendor/bin/codecept run company/tests/unit --xml --html --fail-fast

      #---------- admin app --------------#

      - run:
          name: Run Admin app Codeception functional tests and store result output
          command: cd ./admin && ../vendor/bin/codecept run functional --xml --html --fail-fast

      - run:
         name: Run Codeception tests and store result output
         command: cd ./admin && ../vendor/bin/codecept run unit --xml --html --fail-fast

      #---------- candidate app --------------#

      - run:
          name: Run User app Codeception functional tests and store result output
          command: cd ./candidate && ../vendor/bin/codecept run functional --xml --html --fail-fast

      - run:
         name: Run Candidate app Codeception unit tests and store result output
         command: cd ./candidate && ../vendor/bin/codecept run unit --xml --html --fail-fast

      #---------- inspector app --------------#

      - run:
          name: Run inspector app Codeception functional tests and store result output
          command: cd ./inspector && ../vendor/bin/codecept run functional --xml --html --fail-fast

      - run:
         name: Run inspector app Codeception unit tests and store result output
         command: cd ./inspector && ../vendor/bin/codecept run unit --xml --html --fail-fast

      #---------- common --------------#

      - run:
          name: Run Common Codeception unit tests and store result output
          command: cd ./common && ../vendor/bin/codecept run unit --xml --html --fail-fast

      - store_test_results:
         path: ~/studenthub/console/runtime/logs

      - store_artifacts:
         path: ~/studenthub/console/runtime/logs/report.html
         destination: report
