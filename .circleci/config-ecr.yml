  build-and-push:
    executor: docker-executor
    environment:
      AWS_REGION: "<your-aws-region>"
      IMAGE_NAME: "<your-image-name>"
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.16
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y awscli
      - run:
          name: Authenticate to AWS ECR
          command: |
            aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin <account-id>.dkr.ecr.$AWS_REGION.amazonaws.com
      - run:
          name: Build Docker Image
          command: |
            IMAGE_TAG="${CIRCLE_BUILD_NUM}"  # Auto-incremented tag based on build number
            echo "Building Docker image with tag: $IMAGE_TAG"
            docker build -t $IMAGE_NAME:$IMAGE_TAG .
      - run:
          name: Tag Docker Image
          command: |
            IMAGE_TAG="${CIRCLE_BUILD_NUM}"
            echo "Tagging Docker image: $IMAGE_NAME:$IMAGE_TAG"
            docker tag $IMAGE_NAME:$IMAGE_TAG <account-id>.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG
      - run:
          name: Push Docker Image to ECR
          command: |
            IMAGE_TAG="${CIRCLE_BUILD_NUM}"
            echo "Pushing Docker image to ECR: $IMAGE_NAME:$IMAGE_TAG"
            docker push <account-id>.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG
      - run:
          name: Push Latest Tag to ECR
          command: |
            docker tag $IMAGE_NAME:$CIRCLE_BUILD_NUM <account-id>.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:latest
            docker push <account-id>.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:latest

  update-ecs-service:
    executor: docker-executor
    environment:
      AWS_REGION: "<your-aws-region>"
      CLUSTER_NAME: "<your-cluster-name>"
      SERVICE_NAME: "<your-service-name>"
      IMAGE_NAME: "<your-image-name>"
    steps:
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y awscli
      - run:
          name: Environment Setup
          command: |
            echo "Running environment setup..."
            # Add your environment setup commands here
            # Example: Run a database migration
            python manage.py migrate
            # Example: Preload some data
            python manage.py loaddata initial_data.json
      - run:
          name: Update ECS Service
          command: |
            aws ecs update-service \
              --cluster $CLUSTER_NAME \
              --service $SERVICE_NAME \
              --force-new-deployment \
              --region $AWS_REGION

workflows:
  version: 2.1

  run_test:
    jobs:
      - run_test:
          context:
            - org-global

  build-and-deploy:
    filters:
      branches:
        only:
          - kk/tech-766-upgrade-apps-aws-ec2-instances-to-use-latest-mysql-and-php  # Specify the branch to trigger this workflow
    jobs:
      - build-and-push
          requires:
            - run_test
      - update-ecs-service:
          requires:
            - build-and-push
