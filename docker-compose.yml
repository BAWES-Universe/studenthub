version: '3.2'

networks:
  studenthub-network:
    driver: bridge

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
    command:
      - --configfile=/traefik.yml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.studenthub.local`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
    networks:
      - studenthub-network
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:5.7
    restart: always
    ports:
      - 3306:3306    
      - 33060:33060
    #volumes:
    #  - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=12345
      - MYSQL_DATABASE=studenthub
      - MYSQL_USER=studenthubuser
      - MYSQL_PASSWORD=12345
    entrypoint:
      sh -c "echo 'CREATE DATABASE IF NOT EXISTS studenthub;CREATE DATABASE IF NOT EXISTS studenthub_test;' > /docker-entrypoint-initdb.d/init.sql;
        /usr/local/bin/docker-entrypoint.sh --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    networks:
      - studenthub-network
  
  redis:
    image: redis:6.2.3
    volumes:
      - redis-data:/data
    networks:
      - studenthub-network

  meilisearch:
    image: getmeili/meilisearch:v1.16
    container_name: meilisearch
    restart: always
    volumes:
      - meilisearch-data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-changeme_master_key_please_set_in_env}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
      - MEILI_DB_PATH=/meili_data
    depends_on:
      - mysql
      - redis
    networks:
      - studenthub-network
 
  #adminer:
  #  image: adminer
  #  restart: always
  #  ports:
  #    - 8080:8080

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=12345
      - UPLOAD_LIMIT=300M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.studenthub.local`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"
    depends_on:
      - "mysql"
    networks:
      - studenthub-network
 
  # Start container to install composer deps and kill after
  composer-deps:
    build: admin
    command: composer install
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    networks:
      - studenthub-network

  # Start container to init dev environment and kill after
  init-environment:
    build: admin
    command: ./init --env=Development --overwrite=All
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    depends_on:
      - "composer-deps"
    networks:
      - studenthub-network

  # Start container to run db migrations and kill after
  db-migration:
    build: admin
    command: bash -c "sleep 20 && ./yii migrate --interactive=0 && ./yii_test migrate --interactive=0"
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    depends_on:
      - "init-environment"
      - "mysql"
      - "redis"
      - "composer-deps"
    networks:
      - studenthub-network

  # Load fixture data
  load-fixture:
    build: admin
    command: bash -c "sleep 20 && ./yii fixture/load '*' --interactive=0"
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    depends_on:
      - "db-migration"
    networks:
      - studenthub-network

  #cron:
  #  build: cron
  #  volumes:
  #    # Re-use local composer cache via host-volume
  #    - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
  #    - ./:/app
  #  depends_on:
  #    - "load-fixture"

  admin:
    build: admin
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.studenthub.local`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.services.admin.loadbalancer.server.port=80"
    depends_on:
      - "load-fixture"
    networks:
      - studenthub-network

  candidate:
