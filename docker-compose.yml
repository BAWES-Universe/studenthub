    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.candidate.rule=Host(`candidate.studenthub.local`)"
      - "traefik.http.routers.candidate.entrypoints=web"
      - "traefik.http.services.candidate.loadbalancer.server.port=80"
    depends_on:
      - "load-fixture"
    networks:
      - studenthub-network

  company:
    build: company
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.company.rule=Host(`company.studenthub.local`)"
      - "traefik.http.routers.company.entrypoints=web"
      - "traefik.http.services.company.loadbalancer.server.port=80"
    depends_on:
      - "load-fixture"
    networks:
      - studenthub-network

  staff:
    build: staff
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.staff.rule=Host(`staff.studenthub.local`)"
      - "traefik.http.routers.staff.entrypoints=web"
      - "traefik.http.services.staff.loadbalancer.server.port=80"
    depends_on:
      - "load-fixture"
    networks:
      - studenthub-network

  manager:
    build: manager
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.manager.rule=Host(`manager.studenthub.local`)"
      - "traefik.http.routers.manager.entrypoints=web"
      - "traefik.http.services.manager.loadbalancer.server.port=80"
    depends_on:
      - "load-fixture"
    networks:
      - studenthub-network

  inspector:
    build: inspector
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inspector.rule=Host(`inspector.studenthub.local`)"
      - "traefik.http.routers.inspector.entrypoints=web"
      - "traefik.http.services.inspector.loadbalancer.server.port=80"
    depends_on:
      - "load-fixture"
    networks:
      - studenthub-network

  verification:
    build: verification
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.verification.rule=Host(`verification.studenthub.local`)"
      - "traefik.http.routers.verification.entrypoints=web"
      - "traefik.http.services.verification.loadbalancer.server.port=80"
    depends_on:
      - "load-fixture"
    networks:
      - studenthub-network

  api-docs:
    build: api-docs
    volumes:
      - ./api-docs/openapi:/usr/share/nginx/html/openapi:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-docs.rule=Host(`api-docs.studenthub.local`)"
      - "traefik.http.routers.api-docs.entrypoints=web"
      - "traefik.http.services.api-docs.loadbalancer.server.port=80"
    networks:
      - studenthub-network

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:
