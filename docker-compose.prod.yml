# Production compose file
# Extends docker-compose.yml with production-specific configurations
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  mysql:
    volumes:
      - mysql-data:/var/lib/mysql  # Persistent volume for production
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

  redis:
    restart: always

  meilisearch:
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_DB_PATH=/meili_data

  admin:
    restart: always
    environment:
      - YII_ENV=production

  candidate:
    restart: always
    environment:
      - YII_ENV=production

  company:
    restart: always
    environment:
      - YII_ENV=production

  staff:
    restart: always
    environment:
      - YII_ENV=production

  manager:
    restart: always
    environment:
      - YII_ENV=production

  inspector:
    restart: always
    environment:
      - YII_ENV=production

  verification:
    restart: always
    environment:
      - YII_ENV=production

